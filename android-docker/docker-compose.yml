# Android RK3576 Docker Compose — python-matter-server only
# OTBR은 네이티브 빌드 (docker-android.sh에서 관리)
#
# DOCKER_HOST=unix:///run/docker.sock docker-compose -f /data/local/tmp/docker-compose.yml up -d
#
# 이미지 버전 (오프라인 tar.gz로 로드, 인터넷 pull 안 함):
#   python-matter-server: 8.1.2 (ghcr.io/matter-js/python-matter-server:stable)
#   Docker Engine: 29.3.0, Docker Compose: v5.1.1
#
# OTBR은 네이티브 바이너리로 실행 (OTBR_BACKBONE_ROUTER=OFF):
#   Android system_server가 MRT6 소켓 선점 → Docker OTBR 이미지 사용 불가
#   네이티브 빌드는 build-otbr.sh (scripts/)로 생성, matterjs 버전과 동일

services:
  matter-server:
    image: ghcr.io/matter-js/python-matter-server:stable
    container_name: matter-server
    network_mode: host
    privileged: true
    volumes:
      - matter-data:/data
    command:
      - "--storage-path"
      - "/data"
      - "--port"
      - "5580"
      - "--primary-interface"
      - "wlan0"
    restart: unless-stopped

volumes:
  matter-data:
