# HomeAgent hub broker. Replaces the stock mosquitto.conf that package/mosquitto
# installs (mosquitto.mk:115), which is all comments and therefore inherits 2.0's
# defaults -- and those defaults do not work for us:
#
#   - mosquitto 2.0 refuses anonymous clients unless told otherwise, so Zigbee2MQTT
#     would sit in a connect/deny loop against its own local broker.
#   - with no listener line it binds 127.0.0.1 only, which IS what we want, but we
#     state it explicitly so the intent survives a version bump.
#
# Loopback only, on purpose. Z2M runs on the same box, and an unauthenticated broker
# reachable from the LAN is a control path into every paired Zigbee device. Opening
# it to the network is a deliberate decision that comes with credentials, not a
# default. See bsp/overlay/README.md.
listener 1883 127.0.0.1
allow_anonymous true

# Retained messages and subscriptions survive a reboot. /var is a real directory on
# the ext4 rootfs here (not tmpfs), so this actually persists.
persistence true
persistence_location /var/lib/mosquitto/

log_dest syslog
log_type error
log_type warning
log_type notice
