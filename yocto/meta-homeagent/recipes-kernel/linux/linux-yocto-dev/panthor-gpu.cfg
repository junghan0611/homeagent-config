# Mali-G610 (Valhall CSF) GPU support via panthor driver
# Requires kernel 6.10+
CONFIG_DRM_PANTHOR=m
# CONFIG_DRM_PANFROST is not set

# RK3588 HDMI output stack (kernel 6.13+)
# VOP2 display controller
CONFIG_DRM_ROCKCHIP=m
CONFIG_ROCKCHIP_DW_HDMI=y
CONFIG_ROCKCHIP_DW_HDMI_QP=y

# HDMI PHY (Samsung HDPTX)
CONFIG_PHY_ROCKCHIP_SAMSUNG_HDPTX=m

# DRM bridge helpers for DW HDMI QP
CONFIG_DRM_DW_HDMI_CEC=m
