# HomeAgent Yocto Layer — Orange Pi 5 (RK3588S)
# RPi5 build/conf와 완전 분리. 버전(Scarthgap)만 동일.
# 2026-04-08: meta-rockchip을 radxa → JeffyCN(Rockchip 공식 BSP)로 전환
# - vendor kernel 6.1 + NPU/GPU(libmali)/VPU 풀스택

POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

SOURCES = "${TOPDIR}/../sources"

BBLAYERS ?= " \
  ${SOURCES}/poky/meta \
  ${SOURCES}/poky/meta-poky \
  ${SOURCES}/poky/meta-yocto-bsp \
  ${SOURCES}/meta-openembedded/meta-oe \
  ${SOURCES}/meta-openembedded/meta-python \
  ${SOURCES}/meta-openembedded/meta-networking \
  ${SOURCES}/meta-openembedded/meta-multimedia \
  ${SOURCES}/meta-clang \
  ${SOURCES}/meta-rockchip \
  ${TOPDIR}/../meta-homeagent \
  "
