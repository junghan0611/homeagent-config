# Zigbee2MQTT 2.10.1 -- HomeAgent hub defaults.
#
# Z2M rewrites this file at runtime (it persists pairing state, the network key and
# migrated schema versions here), so treat it as a SEED, not as the source of truth
# once a board has been paired. It ships in the image so a fresh flash comes up
# without hand-editing; back up /var/lib/zigbee2mqtt before reflashing or every
# device has to be re-paired.

mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://127.0.0.1:1883

# serial.port MUST be pinned. Z2M's auto-discovery (no port given) shells out to
# `udevadm`, which does not exist on this Buildroot image (it uses busybox mdev), so
# discovery dies with "spawn udevadm ENOENT" and Z2M exits before touching the radio.
# Verified 2026-07-24 on the arm64 hub: unpinned = every start fails.
#
# Our dongle is the SONOFF ZBDongle-E: a CP2102N (idVendor 10c4), NOT a CDC-ACM part,
# so it enumerates through cp210x as /dev/ttyUSB0 -- ttyUSB, not ttyACM. It speaks
# EmberZNet (7.4.2 GA measured), so the adapter is `ember`. A ZBDongle-P (CC2652P)
# would instead be zstack on its own ttyUSB node; swap both lines if that is the coordinator.
serial:
  port: /dev/ttyUSB0
  adapter: ember

frontend:
  enabled: true
  port: 8080

advanced:
  log_level: info
  log_output:
    - console

homeassistant:
  enabled: false
