# HomeAgent Yocto Build — Orange Pi 5 (RK3588S)
# RPi5 풀스택과 동일 소프트웨어 구성, 하드웨어 레이어만 다름.

MACHINE = "orangepi-5"

# Distro features (RPi5와 동일)
DISTRO_FEATURES:append = " systemd wifi bluetooth pam usrmerge"
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

# Thread/Matter support
DISTRO_FEATURES:append = " ipv6"

# Parallel build (thinkpad: 8 core i7)
BB_NUMBER_THREADS ?= "6"
PARALLEL_MAKE ?= "-j 8"
PARALLEL_MAKE:pn-clang-native = "-j 4"

# Download/cache (RPi5 빌드와 공유 — 도구체인 sstate 재활용)
DL_DIR ?= "${TOPDIR}/../downloads"
SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

SDKMACHINE = "x86_64"

# SSH: openssh (dropbear 대신)
EXTRA_IMAGE_FEATURES += "ssh-server-openssh"
IMAGE_FEATURES:remove = "ssh-server-dropbear"
BAD_RECOMMENDATIONS += "packagegroup-core-ssh-dropbear dropbear"

# Root password: "homeagent" (RPi5와 동일)
INHERIT += "extrausers"
EXTRA_USERS_PARAMS = "usermod -p '\$6\$homeagent\$TzrgPYw/S2Sx4cVt9FbdKL1niRzCtEAvzz6SKq42DTz6DWZiEefWDbiP1l1F942/4a/tu1gSiqywpEUIo.O/p.' root;"

# === 기본 도구 ===
IMAGE_INSTALL:append = " \
    nano \
    vim \
    htop \
    iproute2 \
    kernel-modules \
    ssh-keys \
    shell-config \
    "

# === Matter 스택 (RPi5와 동일) ===

# Zigbee2MQTT + dependencies
IMAGE_INSTALL:append = " \
    nodejs \
    nodejs-npm \
    mosquitto \
    mosquitto-clients \
    "

# Matter controller (matterjs-server via WebSocket :5580)
IMAGE_INSTALL:append = " matterjs-server"

# OpenThread Border Router + mDNS
IMAGE_INSTALL:append = " ot-br-posix avahi-daemon avahi-utils"

# 런타임 패키지 관리 (opkg)
EXTRA_IMAGE_FEATURES += "package-management"

# === OPi5 전용: RPi5에서 제외된 것 ===
# - Hailo NPU → RKNN (별도 레이어, 나중에 추가)
# - RPi 펌웨어 (bcm43455 등) → 불필요
# - Mesa RPi GPU → Mali G610 (나중에 panfrost/panthor)
# - Flutter/ivi-homescreen → 나중에 추가
# - OpenGL/Wayland → 나중에 GPU 드라이버와 함께

# 이미지 포맷
IMAGE_FSTYPES = "wic.bz2 wic.bmap"

# Extra disk space (512MB)
IMAGE_ROOTFS_EXTRA_SPACE = "524288"
