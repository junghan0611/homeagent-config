# Disable in-tree Hailo PCIe driver — meta-hailo provides hailo-pci 4.23.0
# CONFIG_MEDIA_PCI_HAILO is not set

# Use 4K page size — HailoRT 4.23.0 requires max_desc_page_size <= 4096
# RPi5 default is 16K (ARM64_16K_PAGES) which causes HAILO_INTERNAL_FAILURE
CONFIG_ARM64_4K_PAGES=y
# CONFIG_ARM64_16K_PAGES is not set
